<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QuadroCare Tracker</title>
<style>
:root{--bg:#f2f5f4;--surface:#fff;--ink:#14201e;--muted:#5a6865;--line:#d8e0dd;--accent:#0b6e63;--crit:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1412;--surface:#16201e;--ink:#e5eeeb;--muted:#97a8a3;--line:#293633;--accent:#56c6b6;--crit:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--muted);font-size:13.5px}
label{font-size:13px;font-weight:600}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--surface);cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--crit);font-weight:600;min-height:20px}
</style></head><body>
<form id="f" autocomplete="off"><h1>QuadroCare Tracker</h1><p>Area riservata al team di progetto. Inserisci la password di accesso che hai ricevuto.</p>
<label for="pw">Password di accesso</label><input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
<p id="err" role="alert"></p><button id="go" type="submit">Apri il tracker</button></form>
<script>
(function(){
var SALT="BNCrtkprZrzC4SBrU9l44Q==",IV="a1GQ7vM/x3anzyjY",ITER=600000,DATA="UIwlFwQ2Cp6XeLYwHkdDmOUUwto4fFZGMAGcwW7u7005ODctIfq6+nKsMJqKIgG9nl1WZSL+tQu9KpQ/YafYdBPYZslAQUsreOgq0N5uGXXg4yXuRBUQIyUL[...]
function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
var f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go"),pw=document.getElementById("pw");
function open(p){
  if(!(window.crypto&&crypto.subtle))return Promise.reject("nocrypto");
  return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])
  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},k,b(DATA))}).then(function(buf){
    var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()})}
f.addEventListener("submit",function(e){e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Apro…";
  open(pw.value.trim()).catch(function(x){go.disabled=false;go.textContent="Apri il tracker";
    err.textContent=x==="nocrypto"?"Questo browser non permette l'apertura. Usa un browser aggiornato e un indirizzo https.":"Password non valida. Riprova.";pw.select()})});
})();
</script></body></html>
